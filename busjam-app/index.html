<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open the App Store</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6ef; color: #19342f; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 24px; color: inherit; text-decoration: none; cursor: pointer; }
    .page:focus-visible { outline: 3px solid #137960; outline-offset: -6px; }
    main { max-width: 440px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: #64766f; }
    .button { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #137960; color: white; }
  </style>
</head>
<body>
  <a class="page" href="https://apps.apple.com/app/id6814166750" aria-label="Open in the App Store">
    <main>
      <h1>Open the App Store</h1>
      <p>Tap anywhere to continue.</p>
      <span class="button">Continue</span>
    </main>
  </a>
</body>
</html>
